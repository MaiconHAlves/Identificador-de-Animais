name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Versão fixada pelo Claude para estabilidade

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Free disk space # Essencial para compilação do OpenCV
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libltdl-dev libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev cmake openjdk-17-jdk unzip ninja-build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Android SDK structure for Buildozer
        run: |
          sudo rm -rf $ANDROID_HOME/tools
          sudo ln -s $ANDROID_HOME/cmdline-tools/16.0 $ANDROID_HOME/cmdline-tools/latest || true

      - name: Install NDK and Tools
        run: |
          sdkmanager "ndk;25.1.8937393" "platforms;android-33" "build-tools;34.0.0"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build with Buildozer
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          export ANDROID_SDK_PATH=$ANDROID_HOME
          export ANDROID_NDK_PATH=$ANDROID_HOME/ndk/25.1.8937393
          pip install --user buildozer cython==0.29.33
          yes | buildozer -v android debug
        env:
          ANDROID_SDK_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.1.8937393

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Identificador-Animais-APK
          path: bin/*.apk
